<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc">
  <title id="title">synchronized 的底层实现结构</title>
  <desc id="desc">四层结构自上而下协作：字节码层用 monitorenter 与 ACC_SYNCHRONIZED 定位加锁位置；对象头 Mark Word 记录锁状态；JVM 的 ObjectMonitor 提供互斥与等待队列；操作系统的 Mutex Lock 承担线程阻塞与唤醒。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 0 L 5 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="760" height="530" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="758" height="528" rx="17" fill="none" stroke="#dbe7f3" stroke-width="1.5"/>

  <text x="32" y="45" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0f172a">synchronized 的底层实现结构</text>
  <text x="32" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#526274">字节码定位 · Mark Word 记状态 · Monitor 执行互斥 · OS 兜底阻塞</text>

  <g filter="url(#shadow)">
    <rect x="20" y="96" width="720" height="86" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="34" y="112" width="120" height="54" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>

    <rect x="20" y="200" width="720" height="86" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="34" y="216" width="120" height="54" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>

    <rect x="20" y="304" width="720" height="86" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="34" y="320" width="120" height="54" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>

    <rect x="20" y="408" width="720" height="86" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="34" y="424" width="120" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <text x="94" y="137" font-size="16" font-weight="700" fill="#1d4ed8">字节码层</text>
    <text x="94" y="155" font-size="10" fill="#64748b">Bytecode</text>

    <text x="94" y="241" font-size="16" font-weight="700" fill="#6d28d9">对象内存布局</text>
    <text x="94" y="259" font-size="10" fill="#64748b">Object Header</text>

    <text x="94" y="345" font-size="16" font-weight="700" fill="#b45309">JVM 内部实现</text>
    <text x="94" y="363" font-size="10" fill="#64748b">HotSpot C++ 类</text>

    <text x="94" y="449" font-size="16" font-weight="700" fill="#475569">操作系统</text>
    <text x="94" y="467" font-size="10" fill="#64748b">OS Mutex</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="170" y="133" font-size="15" font-weight="700" fill="#0f172a">同步代码块：<tspan font-family="Consolas, Monaco, monospace">monitorenter</tspan> 1 次 + <tspan font-family="Consolas, Monaco, monospace">monitorexit</tspan> 2 次</text>
    <text x="170" y="157" font-size="13" fill="#475569">异常出口多一条 exit，这是「抛异常也能释放锁」的编译期保证</text>

    <text x="170" y="237" font-size="15" font-weight="700" fill="#0f172a">Mark Word 占 8 字节，是锁状态的唯一记录处</text>
    <text x="170" y="261" font-size="13" fill="#475569">复用同一块内存：hashCode · 线程 ID · Lock Record 指针 + 2 bit 标志位</text>

    <text x="170" y="341" font-size="15" font-weight="700" fill="#0f172a">ObjectMonitor 是真正的互斥执行体</text>
    <text x="170" y="365" font-size="13" fill="#475569">_owner · _recursions · _EntryList · _WaitSet · _cxq</text>

    <text x="170" y="445" font-size="15" font-weight="700" fill="#0f172a">内核阻塞机制（futex）承担挂起与唤醒</text>
    <text x="170" y="469" font-size="13" fill="#475569">涉及用户态与内核态切换，是重量级锁开销的真正来源</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-down)">
    <line x1="94" y1="184" x2="94" y2="197"/>
    <line x1="94" y1="288" x2="94" y2="301"/>
    <line x1="94" y1="392" x2="94" y2="405"/>
  </g>
</svg>
