<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ThreadLocal 引用链</title>
  <desc id="desc">活动线程强引用 ThreadLocalMap，ThreadLocalMap 强引用 Entry；Entry 弱引用 ThreadLocal key，强引用 value。外部强引用决定 key 是否存活，线程存活期间 value 无法被回收。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-strong" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-weak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="698" rx="25" fill="none" stroke="#dbe7f3" stroke-width="2"/>

  <text x="58" y="62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#0f172a">ThreadLocal 引用链</text>
  <text x="58" y="94" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#526274">弱引用保护的是 key，强引用保留的是 value</text>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">
    <line x1="760" y1="58" x2="800" y2="58" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-strong)"/>
    <text x="812" y="63" fill="#475569">强引用</text>
    <line x1="900" y1="58" x2="940" y2="58" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-weak)"/>
    <text x="952" y="63" fill="#b45309">弱引用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="150" width="180" height="124" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="282" y="150" width="206" height="124" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="532" y="150" width="190" height="124" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="766" y="140" width="254" height="144" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <rect x="76" y="444" width="250" height="94" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <rect x="392" y="444" width="240" height="94" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="844" y="444" width="258" height="104" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <text x="148" y="188" font-size="21" font-weight="700" fill="#0f172a">活动线程 Thread</text>
    <text x="148" y="220" font-size="14" fill="#64748b">GC Root</text>
    <rect x="78" y="236" width="140" height="24" rx="12" fill="#dbeafe"/>
    <text x="148" y="253" font-size="12" fill="#1d4ed8">线程池 / Tomcat / EventLoop</text>

    <text x="385" y="193" font-size="21" font-weight="700" fill="#0f172a">ThreadLocalMap</text>
    <text x="385" y="224" font-size="14" fill="#475569">threadLocals</text>
    <text x="385" y="250" font-size="13" fill="#64748b">挂在当前 Thread 上</text>

    <text x="627" y="193" font-size="21" font-weight="700" fill="#0f172a">Entry[] table</text>
    <text x="627" y="225" font-size="13" fill="#64748b">每个槽位持有一个 Entry</text>
    <rect x="565" y="239" width="124" height="20" rx="5" fill="#e2e8f0"/>
    <text x="627" y="253" font-size="11" fill="#475569">Entry · Entry · ...</text>

    <text x="893" y="176" font-size="22" font-weight="700" fill="#0f172a">Entry</text>
    <text x="893" y="200" font-size="12" fill="#9a3412">extends WeakReference&lt;ThreadLocal&lt;?&gt;&gt;</text>
    <rect x="830" y="214" width="126" height="28" rx="7" fill="#ffedd5"/>
    <text x="893" y="233" font-size="13" fill="#9a3412">key：弱引用</text>
    <rect x="830" y="247" width="126" height="28" rx="7" fill="#fee2e2"/>
    <text x="893" y="266" font-size="13" fill="#b91c1c">value：强引用</text>

    <text x="201" y="478" font-size="19" font-weight="700" fill="#065f46">外部强引用</text>
    <text x="201" y="506" font-size="14" fill="#047857">static / 局部变量 / 字段</text>
    <text x="201" y="526" font-size="12" fill="#64748b">决定 key 是否存活</text>

    <text x="512" y="480" font-size="20" font-weight="700" fill="#92400e">ThreadLocal&lt;?&gt;</text>
    <text x="512" y="508" font-size="14" fill="#b45309">key / referent</text>
    <text x="512" y="528" font-size="12" fill="#64748b">有外部强引用时不会被 GC</text>

    <text x="973" y="480" font-size="20" font-weight="700" fill="#991b1b">value 业务对象</text>
    <text x="973" y="510" font-size="14" fill="#b91c1c">被 Entry.value 强引用</text>
    <text x="973" y="531" font-size="12" fill="#64748b">线程存活且 Entry 未清理时无法回收</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="238" y1="212" x2="274" y2="212" stroke="#334155" stroke-width="3" marker-end="url(#arrow-strong)"/>
    <line x1="488" y1="212" x2="524" y2="212" stroke="#334155" stroke-width="3" marker-end="url(#arrow-strong)"/>
    <line x1="722" y1="212" x2="758" y2="212" stroke="#334155" stroke-width="3" marker-end="url(#arrow-strong)"/>

    <line x1="326" y1="491" x2="384" y2="491" stroke="#059669" stroke-width="3" marker-end="url(#arrow-strong)"/>
    <path d="M 766 252 C 710 300, 690 400, 640 444" stroke="#d97706" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow-weak)"/>
    <path d="M 973 284 L 973 374 L 973 436" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-risk)"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">
    <rect x="225" y="110" width="62" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="256" y="128" fill="#334155">强引用</text>
    <rect x="475" y="110" width="62" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="506" y="128" fill="#334155">强引用</text>
    <rect x="709" y="110" width="62" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="740" y="128" fill="#334155">强引用</text>

    <rect x="665" y="334" width="96" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="713" y="353" fill="#b45309">弱引用 key</text>
    <rect x="985" y="334" width="124" height="28" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="1047" y="353" fill="#b91c1c">强引用 value</text>

    <rect x="320" y="548" width="174" height="28" rx="14" fill="#d1fae5"/>
    <text x="407" y="567" fill="#047857">外部强引用 → key 稳定</text>
  </g>

  <rect x="58" y="602" width="1084" height="62" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <circle cx="90" cy="633" r="10" fill="#ef4444"/>
  <text x="90" y="638" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ffffff">!</text>
  <text x="116" y="628" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#991b1b">泄漏条件</text>
  <text x="116" y="650" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#7f1d1d">长期存活线程  +  没有 remove()  +  key 失去外部强引用  →  Entry.key = null，但 value 仍被强引用链保留</text>
</svg>
